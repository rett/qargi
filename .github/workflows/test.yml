# The whole test suite on pull requests and on pushes to develop. master is not listed: after a release it holds
# develop's files, and the release is a pull request first.
name: test

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq shellcheck
      - name: Git identity for the tests that commit
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Tests
        run: bash tests/run.sh
